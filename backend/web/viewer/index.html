<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoadSense — road condition map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; z-index: 1000; top: 12px; right: 12px;
      background: #fff; padding: 12px 14px; border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.2); font-size: 13px; max-width: 230px;
    }
    .panel h1 { font-size: 15px; margin: 0 0 8px; }
    .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px;
      border-radius: 2px; vertical-align: -1px; }
    .row { display: flex; align-items: center; margin: 3px 0; }
    label { display: block; margin-top: 8px; }
    input[type=range] { width: 100%; }
    .muted { color: #666; font-size: 11px; }
    .detail {
      position: absolute; z-index: 1000; bottom: 12px; left: 12px;
      background: #fff; padding: 12px 14px; border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.2); font-size: 13px; width: 280px;
      max-height: 82vh; overflow-y: auto; display: none;
    }
    .detail h2 { font-size: 14px; margin: 0 0 6px; text-transform: capitalize; }
    .detail .close { float: right; cursor: pointer; color: #999; }
    .detail table { width: 100%; border-collapse: collapse; }
    .detail td { padding: 1px 0; }
    .detail td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .trend-worsening { color: #e74c3c; font-weight: 600; }
    .trend-improving { color: #2ecc71; font-weight: 600; }
    .trend-stable { color: #888; }
    .detail button, .leaflet-popup-content button, .photo-btn {
      font: inherit; font-size: 12px; cursor: pointer; border: 1px solid #ccc;
      background: #f5f6f8; border-radius: 6px; padding: 5px 9px; margin: 2px 4px 2px 0;
    }
    .detail button:hover, .leaflet-popup-content button:hover { background: #eaecef; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .thumb { margin: 0; width: 62px; }
    .thumb img { width: 62px; height: 62px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
    .thumb .cap { font-size: 10px; color: #555; line-height: 1.2; margin-top: 2px;
      max-height: 24px; overflow: hidden; word-break: break-word; }
    .photo-add { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .cap-input { font: inherit; font-size: 12px; padding: 4px 6px; border: 1px solid #ccc;
      border-radius: 6px; flex: 1 1 120px; min-width: 90px; }
    .popbtns { margin: 6px 0 4px; }
    .up-status { font-size: 11px; }
    .leaflet-popup-content { margin: 10px 12px; min-width: 180px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>RoadSense</h1>
    <div class="legend">
      <div class="row"><i style="background:#2ecc71"></i> smooth</div>
      <div class="row"><i style="background:#f1c40f"></i> minor</div>
      <div class="row"><i style="background:#e67e22"></i> rough</div>
      <div class="row"><i style="background:#e74c3c"></i> severe</div>
    </div>
    <label>Min confidence: <span id="confVal">0.0</span>
      <input id="conf" type="range" min="0" max="1" step="0.05" value="0" />
    </label>
    <label><input id="defects" type="checkbox" checked /> Show clustered defects</label>
    <div class="muted">Hex = ~25 m road tile (opacity ∝ confidence). Dot = precise
      pothole. Ringed marker = defect clustered across passes. Click a hex/dot for
      raw data + conclusion; click a defect to add a photo.</div>
    <div class="muted" id="status">loading…</div>
  </div>
  <div class="detail" id="detail"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
